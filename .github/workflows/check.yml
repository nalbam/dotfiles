name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.x']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh
      - name: Install Bash 5 on macOS
        # The DGX Spark stack scripts need Bash 4.4+; macOS /bin/bash is 3.2 and
        # still runs the dot CLI tests, which must stay Bash 3.2 compatible.
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew list bash >/dev/null 2>&1 || brew install bash
      - name: Verify generated files and regressions
        run: |
          python scripts/gen-ai-tools.py --check
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check shell syntax and whitespace
        shell: bash
        run: |
          for file in run.sh bin/dot lib/*.sh modules/*.sh config/shell/aliases config/shell/bashrc \
              config/shell/profile config/shell/nvm.sh config/shell/zprofile/*.sh config/macos/defaults.sh \
              stacks/dgx-spark/scripts/*.sh stacks/grafana/*.sh; do
            bash -n "$file"
          done
          # Shared shell startup files must also parse in Zsh. (Tests run bin/dot with /bin/bash,
          # which is Bash 3.2 on macOS runners.)
          for file in config/shell/aliases config/shell/profile config/shell/nvm.sh config/shell/zshrc config/shell/zprofile/*.sh; do
            zsh -n "$file"
          done
          git show --format= --check --diff-merges=first-parent HEAD
