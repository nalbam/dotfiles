# Execution permissions
approval_policy = "never"
default_permissions = ":danger-full-access"

# Model and responses
model_reasoning_effort = "xhigh"
model_verbosity = "low"
model_context_window = 1000000

# Project context and search
project_doc_max_bytes = 131072
web_search = "live"

# Feature flags
[features]
hooks = true
memories = true
# Keep under-development features disabled in the shared configuration.
chronicle = false
local_thread_store_compression = false

# Memory generation and retrieval
[memories]
generate_memories = true
use_memories = true

# Terminal display defaults; existing machine choices are preserved.
[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-used",
  "context-window-size",
]

# Optional workspace profile; select with default_permissions = "git-write".
[permissions.git-write]
extends = ":workspace"

[permissions.git-write.filesystem.":workspace_roots"]
".git" = "write"

[permissions.git-write.network]
enabled = true
