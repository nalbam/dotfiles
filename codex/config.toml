approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "git-write"

web_search = "live"

model_reasoning_effort = "xhigh"
model_verbosity = "low"
model_context_window = 1000000

project_doc_max_bytes = 131072

[permissions.git-write]
extends = ":workspace"

[permissions.git-write.filesystem.":workspace_roots"]
".git" = "write"

[permissions.git-write.network]
enabled = true

[features]
hooks = true
memories = true
chronicle = true
local_thread_store_compression = true

[memories]
generate_memories = true
use_memories = true
