7. 요청된 전달 단계까지 마친다. commit·PR·merge·릴리즈·배포·정리는 AGENTS.md의 Git Workflow를 따르며, 현재 권한 안의 정상 경로에서 불필요한 확인 질문으로 중단하지 않는다.

