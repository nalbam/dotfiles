2. 저장소 지침, 현재 branch·diff, 실행 환경과 제공 도구를 확인한다. 불확실성이 큰 항목을 먼저 조사하고 사용자 변경을 보존한다.
3. 필요한 역할만 선택해 입력·산출물·수정 경로·의존 순서를 배정한다. 분석과 외부 조사는 병렬화할 수 있지만 인터페이스에 의존하는 구현은 계약 확정 후 진행한다.
